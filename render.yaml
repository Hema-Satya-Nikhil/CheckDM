services:
  - type: web
    name: checkdm-web
    runtime: node
    buildCommand: npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: checkdm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: checkdm-redis
          type: keyvalue
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: EMAIL_SERVER
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v25.0
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false

  - type: worker
    name: checkdm-worker
    runtime: node
    buildCommand: npm run db:generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_URL
      - key: NEXTAUTH_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_SECRET
      - key: CRON_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: CRON_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          name: checkdm-web
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: checkdm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: checkdm-redis
          type: keyvalue
          property: connectionString
      - key: COMMENT_POLL_INTERVAL_MS
        value: "300000"
      - key: COMMENT_POLL_LOOKBACK_HOURS
        value: "72"
      - key: COMMENT_POLL_MAX_PER_SWEEP
        value: "30"
      - key: META_GRAPH_API_VERSION
        fromService:
          name: checkdm-web
          type: web
          envVarKey: META_GRAPH_API_VERSION
      - key: INSTAGRAM_APP_ID
        fromService:
          name: checkdm-web
          type: web
          envVarKey: INSTAGRAM_APP_ID
      - key: INSTAGRAM_APP_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: INSTAGRAM_APP_SECRET
      - key: FACEBOOK_APP_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: FACEBOOK_APP_SECRET

  - type: cron
    name: checkdm-cron-attach-next-reel
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: npm run db:generate
    startCommand: node scripts/render-cron.mjs attach-next-reel
    envVars:
      - key: CRON_BASE_URL
        fromService:
          name: checkdm-web
          type: web
          property: host
      - key: NEXTAUTH_URL
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_URL
      - key: CRON_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: CRON_SECRET
      - key: NEXTAUTH_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_SECRET

  - type: cron
    name: checkdm-cron-refresh-tokens
    runtime: node
    schedule: "0 5 * * *"
    buildCommand: npm run db:generate
    startCommand: node scripts/render-cron.mjs refresh-tokens
    envVars:
      - key: CRON_BASE_URL
        fromService:
          name: checkdm-web
          type: web
          property: host
      - key: NEXTAUTH_URL
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_URL
      - key: CRON_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: CRON_SECRET
      - key: NEXTAUTH_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_SECRET

  - type: cron
    name: checkdm-cron-snapshot-followers
    runtime: node
    schedule: "0 7 * * *"
    buildCommand: npm run db:generate
    startCommand: node scripts/render-cron.mjs snapshot-followers
    envVars:
      - key: CRON_BASE_URL
        fromService:
          name: checkdm-web
          type: web
          property: host
      - key: NEXTAUTH_URL
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_URL
      - key: CRON_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: CRON_SECRET
      - key: NEXTAUTH_SECRET
        fromService:
          name: checkdm-web
          type: web
          envVarKey: NEXTAUTH_SECRET

  - type: keyvalue
    name: checkdm-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: checkdm-postgres
    plan: free
    databaseName: checkdm
    user: checkdm
